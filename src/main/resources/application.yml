app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

spring:
  output:
    ansi:
      enabled: always
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      database: users_tutorial_lab02
      uri: ${MONGODB_URI:mongodb://localhost:27017}
  security:
    oauth2:
      client:
        registration:
          switch-edu-id:
            client-id: test-client
            authorization-grant-type: authorization_code
            scope: openid
        provider:
          switch-edu-id:
            issuer-uri: https://auth.dev.si.usi.ch/realms/simurbs

logging:
  level:
    org:
      springframework:
        security: DEBUG
