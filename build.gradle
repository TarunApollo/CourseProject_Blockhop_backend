plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
  	id 'net.ltgt.errorprone' version '4.3.0'
	id 'jacoco'
}

import net.ltgt.gradle.errorprone.CheckSeverity

def replayBundleOutput = layout.projectDirectory.file('anticheat/replay.bundle.mjs')

def readFrontendDirFromDotenv = {
	for (String fileName : ['.env.local', '.env']) {
		File dotenvFile = layout.projectDirectory.file(fileName).asFile
		if (!dotenvFile.exists()) {
			continue
		}
		for (String line : dotenvFile.readLines()) {
			String trimmed = line.trim()
			if (!trimmed.isEmpty() && !trimmed.startsWith('#')) {
				String[] parts = trimmed.split('=', 2)
				if (parts.length == 2 && parts[0] == 'FRONTEND_DIR') {
					return parts[1].trim()
				}
			}
		}
	}
	return null
}

def resolveFrontendDirectory = {
	String configuredDir = readFrontendDirFromDotenv()
	File frontendDir = file(configuredDir ?: '../frontend').canonicalFile
	if (!frontendDir.exists()) {
		throw new GradleException("Frontend directory not found: ${frontendDir}")
	}
	File replayEntry = new File(frontendDir, 'replay/replay.ts')
	if (!replayEntry.exists()) {
		throw new GradleException("Replay entry not found: ${replayEntry}")
	}
	return frontendDir
}

java {
	sourceCompatibility = '25'
	targetCompatibility = '25'
}

group = 'ch.usi.inf.bsc.sa4'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}

dependencies {
  	implementation("org.jspecify:jspecify")
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
	testImplementation 'com.github.spotbugs:spotbugs-annotations:4.8.6'
	testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring4x:4.24.0'
  	errorprone 'com.google.errorprone:error_prone_core:2.42.0' // https://github.com/google/error-prone
	errorprone 'com.uber.nullaway:nullaway:0.12.12' // https://github.com/uber/NullAway
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
}

bootJar {
	archiveFileName = 'lab02-spring-0.0.1-SNAPSHOT.jar'
}

tasks.register('buildReplayBundle', Exec) {
	outputs.file(replayBundleOutput)
	outputs.upToDateWhen { false }
	doFirst {
		File frontendDir = resolveFrontendDirectory()
		File bundleFile = replayBundleOutput.asFile
		bundleFile.parentFile.mkdirs()
		workingDir frontendDir
		commandLine 'npx', 'esbuild', 'replay/replay.ts', '--bundle', '--platform=node', '--format=esm',
			"--outfile=${bundleFile.absolutePath}"
	}
}

tasks.named('bootRun') {
	dependsOn tasks.named('buildReplayBundle')
}

tasks.named('test') {
	useJUnitPlatform()
}

javadoc {
	options.tags = [ "spec.requires:cm:Requires:", "returns", "spec.effects:cm:Effects:", "spec.modifies:cm:Modifies:"  ]
}

test {
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
	}
}

tasks.withType(JavaCompile).configureEach {
	options.errorprone {
		disableAllChecks = true // Other error prone checks are disabled
		check("NullAway", CheckSeverity.ERROR) // bump checks from warnings (default) to errors
		option("NullAway:JSpecifyMode") // https://github.com/uber/NullAway/wiki/JSpecify-Support
		option("NullAway:AnnotatedPackages", "ch.usi.inf.bsc.sa4")
	}
	// Keep a JDK 25 baseline
	options.release = 25
}
