image: gradle:jdk25

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

stages:
  - build
  - test
  - deploy

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

compile_job:
  stage: build
  script: gradle compileJava
  artifacts:
    when: always
    paths:
      - build/classes
    expire_in: 1 hour

javadoc_job:
  stage: build
  script: gradle javadoc
  artifacts:
    when: always
    paths:
      - build/docs
    expire_in: 1 hour

test_job:
  stage: test
  script: gradle test
  artifacts:
    when: always
    reports:
      junit: build/test-results/**/*.xml

pages:
  stage: deploy
  script: mv build/docs/javadoc public
  artifacts:
    paths:
      - public
  rules: 
    - if: $CI_COMMIT_BRANCH == "dev"