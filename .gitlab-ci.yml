image: gradle:jdk25

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  SONARQUBE_PROJECT_KEY: sa4-2026-${CI_PROJECT_ID}
  SONARQUBE_PROJECT_NAME: sa4-2026/team-4-backend

stages:
  - build
  - test
  - deploy
  - quality

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

compile_job:
  stage: build
  script: gradle compileJava
  artifacts:
    when: always
    paths:
      - build/classes
    expire_in: 1 hour

javadoc_job:
  stage: build
  script: gradle javadoc
  artifacts:
    when: always
    paths:
      - build/docs
    expire_in: 1 hour

test_job:
  stage: test
  script: gradle test
  artifacts:
    when: always
    paths:
      - build/reports/jacoco/test/*
      - build/reports/tests/*
      - build/test-results/test/TEST-*
      - build/classes
    reports:
      junit: [ build/reports/jacoco/test/jacocoTestReport.xml, build/test-results/test/**/TEST-*.xml ]
    expire_in: 1 hour

pages:
  stage: deploy
  script: mv build/docs/javadoc public
  artifacts:
    paths:
      - public
  rules: 
    - if: $CI_COMMIT_BRANCH == "dev"

sonarqube-check-branch:
  stage: quality
  tags:
    - ci-dev-runner
  image:
    name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/sonarsource/sonar-scanner-cli:latest
    entrypoint: [ '' ]
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar' # Defines the location of the analysis task cache
    GIT_DEPTH: '0' # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: '${CI_JOB_NAME}'
    paths:
      - .sonar/cache
  script:
    - sonar-scanner