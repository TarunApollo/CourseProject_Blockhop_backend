image: gradle:jdk25@sha256:52b7f47813c7f08274c1811105590dcb33314f4f90f2f2b17e0247d80391e154

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  SONARQUBE_PROJECT_KEY: sa4-2026-${CI_PROJECT_ID}
  SONARQUBE_PROJECT_NAME: sa4-2026/team-4-backend
  SSH_HOST: "gitlab-cd@hajime.sa4.si.usi.ch"
  DOCKER_STAGING_HOST: "hajime.sa4.si.usi.ch"
  CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX_SLASH: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/
  FRONTEND_BASE_URL: "https://hajime.sa4.si.usi.ch"
  BACKEND_BASE_URL: "https://hajime.sa4.si.usi.ch/backend"
  DOCKER_TLS_CERTDIR: ""

.devops: &devops |
  function setup_ssh_docker_host() {
    echo "Setting up ssh agent proxy..."
    apk add openssh-client

    eval $(ssh-agent -s)

    mkdir -p ~/.ssh

    echo "$DOCKER_CD_KEY" | base64 -d > ~/.ssh/id_rsa
    chmod 600 ~/.ssh/id_rsa

    ssh-keyscan -H "$DOCKER_STAGING_HOST" >> ~/.ssh/known_hosts
    ssh-add ~/.ssh/id_rsa
  }

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "124-deployment"

stages:
  - build
  # - test
  # - quality
  - release
  - deploy

compile_job:
  stage: build
  script: gradle compileJava
  artifacts:
    when: always
    paths:
      - build/classes
    expire_in: 1 hour

javadoc_job:
  stage: build
  script: gradle javadoc
  artifacts:
    when: always
    paths:
      - build/docs
    expire_in: 1 hour

package_job:
  stage: build
  script: gradle assemble
  artifacts:
    when: always
    paths:
      - build/libs
    expire_in: 1 hour

