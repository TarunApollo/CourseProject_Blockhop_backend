release_backend:
  stage: release
  services:
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:28-dind
      alias: docker
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:28
  dependencies:
    - package_job
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - echo "Logging in to Gitlab Container registry with CI credentials..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin "$CI_DEPENDENCY_PROXY_SERVER"
    - docker build --build-arg CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX_SLASH="$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX_SLASH" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

deploy_backend:
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
    - if: ($CI_COMMIT_BRANCH == "124-deployment")
  stage: deploy
  tags:
    - ci-dev-runner
  services:
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:28-dind
      alias: docker
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:28
  before_script:
    - *devops
  variables:
    DOCKER_HOST: tcp://docker:2375
    BACKEND_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}
  script:
    - echo "Logging in to Gitlab Container registry with CI credentials..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - setup_ssh_docker_host
    - unset DOCKER_HOST
    - docker context rm remote --force || true
    - docker context create --docker "host=ssh://$SSH_HOST" remote
    - docker context use remote
    - docker info
    - docker --context remote compose -f deployment/docker-compose.yml config
    - docker --context remote compose -f deployment/docker-compose.yml down
    - docker --context remote compose -f deployment/docker-compose.yml pull
    - docker --context remote compose -f deployment/docker-compose.yml up -d
    - docker --context remote compose -f deployment/docker-compose.yml ps -a
    - docker --context remote inspect -f '{{range .Config.Env}}{{println .}}{{end}}' lab-05-backend | grep -E 'SPRING_MONGODB_URI|SPRING_DATA_MONGODB_URI|JAVA_TOOL_OPTIONS|MONGODB_URI' || true
    - docker --context remote inspect -f 'name={{.Name}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' lab-05-backend || true
    - docker --context remote logs --tail=200 lab-05-backend || true
    - docker --context remote logs --tail=100 deployment-mongodb-1 || true

pages:
  stage: deploy
  script: mv build/docs/javadoc public
  artifacts:
    paths:
      - public
  rules: 
    - if: $CI_COMMIT_BRANCH == "dev"

